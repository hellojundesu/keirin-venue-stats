name: Deploy venue stats

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Verify uploaded Pages artifact
        uses: actions/github-script@v7
        env:
          ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          script: |
            const name = process.env.ARTIFACT_NAME;
            for (let attempt = 0; attempt < 6; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo,
                run_id: context.runId, per_page: 100
              });
              const matches = data.artifacts.filter(a => a.name === name && !a.expired);
              if (matches.length === 1) {
                core.info('Verified Pages artifact ID ' + matches[0].id);
                return;
              }
              if (matches.length > 1) throw new Error('Duplicate current-attempt Pages artifact');
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Current-attempt Pages artifact is not visible; deployment stopped');

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
