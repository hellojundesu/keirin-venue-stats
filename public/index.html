<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>競輪 選手別・競輪場成績</title>
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--ink:#18212e;--muted:#687386;--line:#dfe4eb;--blue:#1769aa;--pink:#c94370;--navy:#123552;--soft:#edf5fb;--shadow:0 8px 26px rgba(24,33,46,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",sans-serif;font-size:22px}.shell{width:92vw;max-width:1760px;margin:auto;padding:32px}
    header{display:flex;justify-content:space-between;gap:26px;align-items:flex-end;margin-bottom:24px}h1{font-size:clamp(32px,4vw,46px);margin:0;color:var(--navy)}.period{font-size:17px;color:var(--muted);text-align:right}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:28px;margin-bottom:22px}.mode-tabs,.gender-tabs{display:flex;gap:12px;margin-bottom:22px}.mode-tabs button,.gender-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:14px;padding:18px;font-size:22px;font-weight:700;cursor:pointer}.mode-tabs button.active{color:#fff;background:var(--navy);border-color:var(--navy)}.gender-tabs button.active[data-gender=male]{color:#fff;background:var(--blue);border-color:var(--blue)}.gender-tabs button.active[data-gender=female]{color:#fff;background:var(--pink);border-color:var(--pink)}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:20px}.field label{display:block;font-weight:700;font-size:18px;margin:0 0 10px}.field input,.field select{width:100%;border:1px solid #bdc6d2;border-radius:12px;padding:17px;background:#fff;font-size:21px}.help{margin:12px 0 0;color:var(--muted);font-size:16px}
    .empty{text-align:center;padding:66px 16px;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:28px;margin-bottom:10px}.athlete-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:19px}.athlete-name{font-size:34px;font-weight:800}.class-badge{display:inline-block;margin-left:11px;padding:5px 10px;border-radius:8px;background:var(--soft);color:var(--blue);font-size:17px;vertical-align:middle}.athlete-kana{font-size:17px;color:var(--muted);margin-top:4px}.total{font-weight:700;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:16px 15px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#f1f4f7;color:#39475a;font-size:17px}th:first-child,td:first-child{text-align:left;font-weight:700}tr:last-child td{border-bottom:0}.rate{font-weight:800;color:var(--navy)}.decisions{font-variant-numeric:tabular-nums;color:#475468}
    .notice{font-size:17px;color:#654b12;background:#fff8df;border:1px solid #efdb9c;border-radius:12px;padding:14px 16px;margin-bottom:20px}.period-buttons{display:flex;border:1px solid #bdc6d2;border-radius:12px;overflow:hidden;background:#fff}.period-buttons button{flex:1;border:0;border-right:1px solid #d8dee7;background:#fff;padding:17px 10px;font-size:21px;font-weight:700;cursor:pointer}.period-buttons button:last-child{border-right:0}.period-buttons button.active{color:#fff;background:var(--blue)}.trend-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px}.trend-card{border:1px solid var(--line);border-radius:16px;overflow:hidden}.trend-card h2{margin:0;padding:20px 22px;background:#f1f4f7;color:var(--navy);font-size:27px}.trend-summary{padding:15px 22px;color:var(--muted);font-size:18px;border-bottom:1px solid var(--line)}.trend-table{min-width:0}.trend-table th,.trend-table td{text-align:right}.trend-table th:first-child,.trend-table td:first-child{text-align:left}.bar{height:11px;background:#e9edf2;border-radius:99px;overflow:hidden;margin-top:8px}.bar span{display:block;height:100%;background:var(--blue);border-radius:99px}.hidden{display:none!important}@media(max-width:1100px){body{font-size:18px}.controls{grid-template-columns:repeat(2,minmax(220px,1fr))}.trend-grid{grid-template-columns:1fr}.field input,.field select{font-size:18px}.mode-tabs button,.gender-tabs button{font-size:19px}}@media(max-width:650px){body{font-size:16px}.shell{width:auto;padding:12px}header{align-items:flex-start;flex-direction:column}.period{font-size:13px;text-align:left}.panel{padding:14px}.controls{grid-template-columns:1fr}.athlete-head{align-items:flex-start;flex-direction:column}.mode-tabs button,.gender-tabs button{font-size:15px}.field label{font-size:14px}.field input,.field select{font-size:16px}.help{font-size:13px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><h1 id="pageTitle">選手別・競輪場成績</h1><div id="period" class="period">データ読込中</div></header>
    <nav class="mode-tabs" aria-label="表示切替">
      <button type="button" data-mode="athlete" class="active">選手別成績</button>
      <button type="button" data-mode="trend">競輪場の決まり手傾向</button>
    </nav>
    <div id="athleteView">
    <section class="panel">
      <div class="gender-tabs" role="tablist">
        <button type="button" data-gender="male" class="active">男子選手</button>
        <button type="button" data-gender="female">ガールズ選手</button>
      </div>
      <div class="controls">
        <div class="field"><label for="search">選手名検索（漢字・カナ）</label><input id="search" autocomplete="off" placeholder="例：古性 または コショウ"></div>
        <div class="field"><label for="classCode">級班で絞り込み</label><select id="classCode"><option value="">すべての級班</option></select></div>
        <div class="field"><label for="athlete">あいうえお順から選択</label><select id="athlete"><option value="">選択なし</option></select></div>
        <div class="field"><label for="venue">競輪場を選択</label><select id="venue"><option value="">全競輪場</option></select></div>
      </div>
      <p id="count" class="help"></p>
    </section>
    <div id="notice" class="notice hidden"></div>
    <section id="empty" class="panel empty"><strong>選手を選択してください</strong>名前検索または、あいうえお順の一覧から選べます。</section>
    <section id="detail" class="panel hidden">
      <div class="athlete-head"><div><div class="athlete-name"><span id="athleteName"></span><span id="athleteClass" class="class-badge"></span></div><div id="athleteKana" class="athlete-kana"></div></div><div id="total" class="total"></div></div>
      <div class="table-wrap"><table><thead><tr><th>競輪場</th><th>出走</th><th>1着</th><th>勝率</th><th>2連対</th><th>2連対率</th><th>3連対</th><th>3連対率</th><th>決まり手（逃・捲・差・マ）</th></tr></thead><tbody id="venueRows"></tbody></table></div>
      <p class="help">率の分母は実出走。欠場は除外し、棄権・失格は実出走に含みます。決まり手は当該選手の1着時に記録された値です。</p>
    </section>
    </div>
    <div id="trendView" class="hidden">
      <section class="panel">
        <div class="controls">
          <div class="field"><label for="trendVenue">競輪場を選択</label><select id="trendVenue"><option value="">選択なし</option></select></div>
          <div class="field"><label>集計期間</label><div class="period-buttons" role="group" aria-label="集計期間"><button type="button" data-period="3" class="active">3年</button><button type="button" data-period="2">2年</button><button type="button" data-period="1">1年</button></div></div>
          <div class="field"><label for="trendGrade">開催区分</label><select id="trendGrade"><option value="">すべて</option><option>F2</option><option>F1</option><option>G3</option><option>G2</option><option>G1</option><option>GP</option></select></div>
          <div class="field"><label for="trendSession">時間帯</label><select id="trendSession"><option value="">すべて</option><option value="morning">モーニング</option><option value="day">デイ</option><option value="night">ナイター</option><option value="midnight">ミッドナイト</option></select></div>
        </div>
        <p class="help">選択期間の全出走選手を対象に、1着・2着の決まり手を集計します。</p>
      </section>
      <section id="trendEmpty" class="panel empty"><strong>競輪場を選択してください</strong>開催区分と時間帯は、選択後にさらに絞り込めます。</section>
      <section id="trendDetail" class="panel hidden">
        <div class="athlete-head"><div><div id="trendTitle" class="athlete-name"></div><div id="trendFilterLabel" class="athlete-kana"></div></div><div id="trendRaceCount" class="total"></div></div>
        <div class="trend-grid"><div id="firstCard" class="trend-card"></div><div id="secondCard" class="trend-card"></div></div>
        <p class="help">率の分母は各着順で決まり手を取得できた件数です。欠損件数は別に表示します。</p>
      </section>
    </div>
  </main>
  <script src="data/athlete-stats.js"></script>
  <script src="data/venue-decision-stats.js"></script>
  <script>
    (()=>{
      const data=window.KEIRIN_TRACK_STATS;
      const $=id=>document.getElementById(id);
      if(!data){$('period').textContent='データを読み込めません';return}
      let gender='male', selected='', selectedVenue='', selectedClass='', mode='athlete', trendPeriodYears=3;
      const normalize=value=>String(value||'').normalize('NFKC').replace(/[\s　]/g,'').toUpperCase();
      const kanaSort=(a,b)=>(a.nameKana||a.name).localeCompare(b.nameKana||b.name,'ja');
      const athletes=data.athletes.filter(a=>a.kanaStatus!=='retired').sort(kanaSort);
      const venues=[...new Map(athletes.flatMap(a=>a.venues).map(v=>[v.venueCode,v.venueName])).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
      $('venue').innerHTML='<option value="">全競輪場</option>'+venues.map(([code,name])=>`<option value="${code}">${name}</option>`).join('');
      const trendStats=window.KEIRIN_VENUE_DECISION_STATS?.stats||data.venueDecisionStats||[];
      const trendVenues=[...new Map(trendStats.map(v=>[v.venueCode,v.venueName])).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
      $('trendVenue').innerHTML='<option value="">選択なし</option>'+trendVenues.map(([code,name])=>`<option value="${code}">${name}</option>`).join('');
      $('period').textContent=`集計対象 ${data.requestedPeriodStart} ～ ${data.requestedPeriodEnd} ／ 実データ ${data.actualPeriodStart||'なし'} ～ ${data.actualPeriodEnd||'なし'}`;
      const complete=Number(data.syncDays?.complete||0), total=Math.round((new Date(data.requestedPeriodEnd)-new Date(data.requestedPeriodStart))/86400000)+1;
      if(complete<total){$('notice').classList.remove('hidden');$('notice').textContent=`3年分の取得処理中です（日付完了 ${complete}/${total}日）。現在取得済みの範囲で表示しています。`}
      const classGroup=value=>value==='S級S班'?'ss':value==='S級1班'||value==='S級2班'?'s':value==='A級1班'||value==='A級2班'?'a12':value==='A級3班'?'a3':value==='L級1班'?'l':'';
      function filtered(){const q=normalize($('search').value);return athletes.filter(a=>a.gender===gender&&(!selectedClass||classGroup(a.classCode)===selectedClass)&&(!q||normalize(a.name).includes(q)||normalize(a.nameKana).includes(q)))}
      function rebuildClasses(){const choices=gender==='female'?[['l','L1']]:[['ss','SS'],['s','S1・S2'],['a12','A1・A2'],['a3','A3']];$('classCode').innerHTML='<option value="">すべての級班</option>'+choices.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}
      function rebuild(){
        const list=filtered(), current=$('athlete').value;
        $('athlete').innerHTML='<option value="">選択なし</option>'+list.map(a=>`<option value="${a.registrationNo}">${a.name}${a.nameKana?'（'+a.nameKana+'）':''}</option>`).join('');
        if(list.some(a=>a.registrationNo===current))$('athlete').value=current;else{selected='';show()}
        $('count').textContent=`表示対象 ${list.length.toLocaleString()}人`;
      }
      function show(){
        const a=athletes.find(x=>x.registrationNo===selected&&x.gender===gender);
        $('empty').classList.toggle('hidden',!!a);$('detail').classList.toggle('hidden',!a);if(!a)return;
        $('athleteName').textContent=a.name;$('athleteClass').textContent=a.classCode||'級班不明';$('athleteKana').textContent=a.nameKana||(a.kanaStatus==='retired'?'引退・フリガナ提供なし':'フリガナ未取得');$('total').textContent=`合計 ${a.totalStarts}走`;
        const shownVenues=selectedVenue?a.venues.filter(v=>v.venueCode===selectedVenue):a.venues;
        $('venueRows').innerHTML=shownVenues.length?shownVenues.map(v=>`<tr><td>${v.venueName}</td><td>${v.starts}</td><td>${v.wins}</td><td class="rate">${v.winRate.toFixed(1)}%</td><td>${v.top2}</td><td class="rate">${v.top2Rate.toFixed(1)}%</td><td>${v.top3}</td><td class="rate">${v.top3Rate.toFixed(1)}%</td><td class="decisions">${v.decisionEscape}・${v.decisionSprint}・${v.decisionPass}・${v.decisionMark}</td></tr>`).join(''):'<tr><td colspan="9">選択した競輪場の出走データがありません</td></tr>';
      }
      const decisionLabels=[['escape','逃'],['sprint','捲'],['pass','差'],['mark','マーク'],['other','その他']];
      function aggregatePosition(rows,key){return rows.reduce((sum,row)=>{const item=row[key];sum.total+=item.total;sum.known+=item.known;sum.missing+=item.missing;decisionLabels.forEach(([code])=>sum[code]+=item[code]);return sum},{total:0,known:0,missing:0,escape:0,sprint:0,pass:0,mark:0,other:0})}
      function trendCard(title,stats){const visible=decisionLabels.filter(([code])=>stats[code]>0||code!=='other');return `<h2>${title}</h2><div class="trend-summary">集計 ${stats.total.toLocaleString()}件 ／ 決まり手取得 ${stats.known.toLocaleString()}件 ／ 欠損 ${stats.missing.toLocaleString()}件</div><table class="trend-table"><thead><tr><th>決まり手</th><th>件数</th><th>割合</th></tr></thead><tbody>${visible.map(([code,label])=>{const pct=stats.known?stats[code]/stats.known*100:0;return `<tr><td>${label}<div class="bar"><span style="width:${pct}%"></span></div></td><td>${stats[code].toLocaleString()}</td><td class="rate">${pct.toFixed(1)}%</td></tr>`}).join('')}</tbody></table>`}
      function showTrend(){const venueCode=$('trendVenue').value,periodYears=trendPeriodYears,grade=$('trendGrade').value,session=$('trendSession').value;const rows=trendStats.filter(x=>x.venueCode===venueCode&&x.periodYears===periodYears&&(!grade||x.gradeCode===grade)&&(!session||x.sessionCode===session));const hasVenue=!!venueCode;$('trendEmpty').classList.toggle('hidden',hasVenue);$('trendDetail').classList.toggle('hidden',!hasVenue);if(!hasVenue)return;const venue=trendVenues.find(x=>x[0]===venueCode),periodStart=rows[0]?.periodStart||'',periodEnd=rows[0]?.periodEnd||data.requestedPeriodEnd;$('trendTitle').textContent=(venue?.[1]||venueCode)+'競輪場';const sessionLabels={morning:'モーニング',day:'デイ',night:'ナイター',midnight:'ミッドナイト'};$('trendFilterLabel').textContent=`過去${periodYears}年（${periodStart} ～ ${periodEnd}）／ 開催区分 ${grade||'すべて'} ／ 時間帯 ${sessionLabels[session]||'すべて'}`;$('trendRaceCount').textContent=`対象 ${rows.reduce((n,x)=>n+x.raceCount,0).toLocaleString()}レース`;$('firstCard').innerHTML=trendCard('1着の決まり手',aggregatePosition(rows,'first'));$('secondCard').innerHTML=trendCard('2着の決まり手',aggregatePosition(rows,'second'))}
      function switchMode(next){mode=next;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x.dataset.mode===mode));$('athleteView').classList.toggle('hidden',mode!=='athlete');$('trendView').classList.toggle('hidden',mode!=='trend');$('pageTitle').textContent=mode==='athlete'?'選手別・競輪場成績':'競輪場の決まり手傾向';if(mode==='trend')showTrend()}
      document.querySelectorAll('[data-mode]').forEach(button=>button.addEventListener('click',()=>switchMode(button.dataset.mode)));
      document.querySelectorAll('[data-gender]').forEach(button=>button.addEventListener('click',()=>{gender=button.dataset.gender;document.querySelectorAll('[data-gender]').forEach(x=>x.classList.toggle('active',x===button));$('search').value='';$('venue').value='';selected='';selectedVenue='';selectedClass='';rebuildClasses();rebuild()}));
      $('search').addEventListener('input',rebuild);$('classCode').addEventListener('change',event=>{selectedClass=event.target.value;selected='';rebuild()});$('athlete').addEventListener('change',event=>{selected=event.target.value;show()});$('venue').addEventListener('change',event=>{selectedVenue=event.target.value;show()});rebuildClasses();rebuild();
      document.querySelectorAll('[data-period]').forEach(button=>button.addEventListener('click',()=>{trendPeriodYears=Number(button.dataset.period);document.querySelectorAll('[data-period]').forEach(x=>x.classList.toggle('active',x===button));showTrend()}));
      ['trendVenue','trendGrade','trendSession'].forEach(id=>$(id).addEventListener('change',showTrend));
    })();
  </script>
</body>
</html>
