<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>競輪 選手別・競輪場成績</title>
  <style>
    :root{--bg:#f4f6f9;--panel:#fff;--ink:#18212e;--muted:#687386;--line:#dfe4eb;--blue:#1769aa;--pink:#c94370;--navy:#123552;--soft:#edf5fb;--shadow:0 8px 26px rgba(24,33,46,.08)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Yu Gothic UI","Meiryo",sans-serif}.shell{max-width:1180px;margin:auto;padding:22px}
    header{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;margin-bottom:18px}h1{font-size:clamp(22px,4vw,34px);margin:0;color:var(--navy)}.period{font-size:13px;color:var(--muted);text-align:right}
    .panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px}.gender-tabs{display:flex;gap:8px;margin-bottom:16px}.gender-tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:13px;font-size:16px;font-weight:700;cursor:pointer}.gender-tabs button.active[data-gender=male]{color:#fff;background:var(--blue);border-color:var(--blue)}.gender-tabs button.active[data-gender=female]{color:#fff;background:var(--pink);border-color:var(--pink)}
    .controls{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:14px}.field label{display:block;font-weight:700;font-size:13px;margin:0 0 7px}.field input,.field select{width:100%;border:1px solid #bdc6d2;border-radius:10px;padding:12px;background:#fff;font-size:16px}.help{margin:9px 0 0;color:var(--muted);font-size:12px}
    .empty{text-align:center;padding:52px 12px;color:var(--muted)}.empty strong{display:block;color:var(--navy);font-size:21px;margin-bottom:8px}.athlete-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:15px}.athlete-name{font-size:26px;font-weight:800}.class-badge{display:inline-block;margin-left:9px;padding:4px 8px;border-radius:7px;background:var(--soft);color:var(--blue);font-size:13px;vertical-align:middle}.athlete-kana{font-size:13px;color:var(--muted);margin-top:3px}.total{font-weight:700;color:var(--muted)}
    .table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:860px}th,td{padding:11px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}th{position:sticky;top:0;background:#f1f4f7;color:#39475a;font-size:12px}th:first-child,td:first-child{text-align:left;font-weight:700}tr:last-child td{border-bottom:0}.rate{font-weight:800;color:var(--navy)}.decisions{font-variant-numeric:tabular-nums;color:#475468}
    .notice{font-size:13px;color:#654b12;background:#fff8df;border:1px solid #efdb9c;border-radius:10px;padding:10px 12px;margin-bottom:14px}.hidden{display:none}@media(max-width:900px){.controls{grid-template-columns:repeat(2,minmax(180px,1fr))}}@media(max-width:650px){.shell{padding:12px}header{align-items:flex-start;flex-direction:column}.period{text-align:left}.panel{padding:14px}.controls{grid-template-columns:1fr}.athlete-head{align-items:flex-start;flex-direction:column}.gender-tabs button{font-size:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><h1>選手別・競輪場成績</h1><div id="period" class="period">データ読込中</div></header>
    <section class="panel">
      <div class="gender-tabs" role="tablist">
        <button type="button" data-gender="male" class="active">男子選手</button>
        <button type="button" data-gender="female">ガールズ選手</button>
      </div>
      <div class="controls">
        <div class="field"><label for="search">選手名検索（漢字・カナ）</label><input id="search" autocomplete="off" placeholder="例：古性 または コショウ"></div>
        <div class="field"><label for="classCode">級班で絞り込み</label><select id="classCode"><option value="">すべての級班</option></select></div>
        <div class="field"><label for="athlete">あいうえお順から選択</label><select id="athlete"><option value="">選択なし</option></select></div>
        <div class="field"><label for="venue">競輪場を選択</label><select id="venue"><option value="">全競輪場</option></select></div>
      </div>
      <p id="count" class="help"></p>
    </section>
    <div id="notice" class="notice hidden"></div>
    <section id="empty" class="panel empty"><strong>選手を選択してください</strong>名前検索または、あいうえお順の一覧から選べます。</section>
    <section id="detail" class="panel hidden">
      <div class="athlete-head"><div><div class="athlete-name"><span id="athleteName"></span><span id="athleteClass" class="class-badge"></span></div><div id="athleteKana" class="athlete-kana"></div></div><div id="total" class="total"></div></div>
      <div class="table-wrap"><table><thead><tr><th>競輪場</th><th>出走</th><th>1着</th><th>勝率</th><th>2連対</th><th>2連対率</th><th>3連対</th><th>3連対率</th><th>決まり手（逃・捲・差・マ）</th></tr></thead><tbody id="venueRows"></tbody></table></div>
      <p class="help">率の分母は実出走。欠場は除外し、棄権・失格は実出走に含みます。決まり手は当該選手の1着時に記録された値です。</p>
    </section>
  </main>
  <script src="data/athlete-stats.js"></script>
  <script>
    (()=>{
      const data=window.KEIRIN_TRACK_STATS;
      const $=id=>document.getElementById(id);
      if(!data){$('period').textContent='データを読み込めません';return}
      let gender='male', selected='', selectedVenue='', selectedClass='';
      const normalize=value=>String(value||'').normalize('NFKC').replace(/[\s　]/g,'').toUpperCase();
      const kanaSort=(a,b)=>(a.nameKana||a.name).localeCompare(b.nameKana||b.name,'ja');
      const athletes=data.athletes.filter(a=>a.kanaStatus!=='retired').sort(kanaSort);
      const venues=[...new Map(athletes.flatMap(a=>a.venues).map(v=>[v.venueCode,v.venueName])).entries()].sort((a,b)=>a[0].localeCompare(b[0]));
      $('venue').innerHTML='<option value="">全競輪場</option>'+venues.map(([code,name])=>`<option value="${code}">${name}</option>`).join('');
      $('period').textContent=`集計対象 ${data.requestedPeriodStart} ～ ${data.requestedPeriodEnd} ／ 実データ ${data.actualPeriodStart||'なし'} ～ ${data.actualPeriodEnd||'なし'}`;
      const complete=Number(data.syncDays?.complete||0), total=Math.round((new Date(data.requestedPeriodEnd)-new Date(data.requestedPeriodStart))/86400000)+1;
      if(complete<total){$('notice').classList.remove('hidden');$('notice').textContent=`3年分の取得処理中です（日付完了 ${complete}/${total}日）。現在取得済みの範囲で表示しています。`}
      const classGroup=value=>value==='S級S班'?'ss':value==='S級1班'||value==='S級2班'?'s':value==='A級1班'||value==='A級2班'?'a12':value==='A級3班'?'a3':value==='L級1班'?'l':'';
      function filtered(){const q=normalize($('search').value);return athletes.filter(a=>a.gender===gender&&(!selectedClass||classGroup(a.classCode)===selectedClass)&&(!q||normalize(a.name).includes(q)||normalize(a.nameKana).includes(q)))}
      function rebuildClasses(){const choices=gender==='female'?[['l','L1']]:[['ss','SS'],['s','S1・S2'],['a12','A1・A2'],['a3','A3']];$('classCode').innerHTML='<option value="">すべての級班</option>'+choices.map(([value,label])=>`<option value="${value}">${label}</option>`).join('')}
      function rebuild(){
        const list=filtered(), current=$('athlete').value;
        $('athlete').innerHTML='<option value="">選択なし</option>'+list.map(a=>`<option value="${a.registrationNo}">${a.name}${a.nameKana?'（'+a.nameKana+'）':''}</option>`).join('');
        if(list.some(a=>a.registrationNo===current))$('athlete').value=current;else{selected='';show()}
        $('count').textContent=`表示対象 ${list.length.toLocaleString()}人`;
      }
      function show(){
        const a=athletes.find(x=>x.registrationNo===selected&&x.gender===gender);
        $('empty').classList.toggle('hidden',!!a);$('detail').classList.toggle('hidden',!a);if(!a)return;
        $('athleteName').textContent=a.name;$('athleteClass').textContent=a.classCode||'級班不明';$('athleteKana').textContent=a.nameKana||(a.kanaStatus==='retired'?'引退・フリガナ提供なし':'フリガナ未取得');$('total').textContent=`合計 ${a.totalStarts}走`;
        const shownVenues=selectedVenue?a.venues.filter(v=>v.venueCode===selectedVenue):a.venues;
        $('venueRows').innerHTML=shownVenues.length?shownVenues.map(v=>`<tr><td>${v.venueName}</td><td>${v.starts}</td><td>${v.wins}</td><td class="rate">${v.winRate.toFixed(1)}%</td><td>${v.top2}</td><td class="rate">${v.top2Rate.toFixed(1)}%</td><td>${v.top3}</td><td class="rate">${v.top3Rate.toFixed(1)}%</td><td class="decisions">${v.decisionEscape}・${v.decisionSprint}・${v.decisionPass}・${v.decisionMark}</td></tr>`).join(''):'<tr><td colspan="9">選択した競輪場の出走データがありません</td></tr>';
      }
      document.querySelectorAll('[data-gender]').forEach(button=>button.addEventListener('click',()=>{gender=button.dataset.gender;document.querySelectorAll('[data-gender]').forEach(x=>x.classList.toggle('active',x===button));$('search').value='';$('venue').value='';selected='';selectedVenue='';selectedClass='';rebuildClasses();rebuild()}));
      $('search').addEventListener('input',rebuild);$('classCode').addEventListener('change',event=>{selectedClass=event.target.value;selected='';rebuild()});$('athlete').addEventListener('change',event=>{selected=event.target.value;show()});$('venue').addEventListener('change',event=>{selectedVenue=event.target.value;show()});rebuildClasses();rebuild();
    })();
  </script>
</body>
</html>
